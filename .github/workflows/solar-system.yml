name: Workflow of Solar System

on:
    push:
        branches:
            - main
            - 'feature/**'
    workflow_dispatch:

env:
    MONGO_URI: 'mongodb_srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v4
        
        - name: install nodejs
          uses: actions/setup-node@v3
          with:
            node-version: 18
        
        - name: install dependencies
          run: npm install

        - name: unit test
          run: npm test
