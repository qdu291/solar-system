name: Workflow of Solar System

on:
    push:
        branches:
            - main
            - 'feature/**'
    workflow_dispatch:
        
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v4
        
        - name: install nodejs
          uses: actions/setup-node@v3
          with:
            node-version: 18
        
        - name: install dependencies
          run: npm install

        - name: unit test
          run: npm test
